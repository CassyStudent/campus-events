services:
  - type: web
    name: campus-events
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: campus-events-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      - key: DB_STORAGE
        value: /var/data/events.sqlite
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
